# Expenditure & Encumbrance Request System — Apache vhost.
#
# Hostname: argus.example.org — the hundred-eyed watchman, a quiet nod to
# approvals/audit that (like the handoff README asks) avoids expenses./
# finance./accounting. advertising what this host is. To change it, update
# ServerName here, the certificate paths, and base_url in config/config.php.
#
# Copy to /etc/apache2/sites-available/argus.example.org.conf, then:
#   a2enmod ssl headers rewrite
#   mkdir -p /var/www/letsencrypt
#   a2ensite argus.example.org && systemctl reload apache2
#   certbot certonly --webroot -w /var/www/letsencrypt -d argus.example.org \
#       --deploy-hook "systemctl reload apache2"
#
# The :443 vhost is wrapped in <IfFile> so this file is safe to enable before
# the certificate exists: until then only the :80 vhost loads (enough for the
# ACME challenge), and after certbot's deploy hook reloads Apache the HTTPS
# site comes up on its own. Without the guard, a missing cert makes Apache
# refuse to start at all — taking every other site on the box down with it.

<IfFile /etc/letsencrypt/live/argus.example.org/fullchain.pem>
<VirtualHost SERVER_PRIVATE_IP:443>
    ServerName argus.example.org
    DocumentRoot /var/www/argus/public

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/argus.example.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/argus.example.org/privkey.pem

    <Directory /var/www/argus/public>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        # Office only. Network-level filtering is handled in AWS.
        Require ip YOUR_OFFICE_IP
    </Directory>

    # PHP hardening scoped to this site only — the server is shared, so these
    # stay out of the global php.ini (README "Security and accessibility"). Uploads cap
    # must exceed the app's own 20MB attachment limit or PHP truncates first.
    <IfModule php_module>
        php_admin_flag  display_errors      off
        php_admin_flag  log_errors          on
        php_admin_value upload_max_filesize 21M
        php_admin_value post_max_size       25M
        php_admin_value open_basedir        "/var/www/argus/:/usr/share/GeoIP/:/var/lib/php/sessions/:/tmp/"
    </IfModule>

    # Dedicated php-fpm pool (shared servers): uncomment this, and remove the php_module block
    # above for this site. See deploy/php-fpm-pool.conf.example and the README "Shared servers".
    #<FilesMatch "\.php$">
    #    SetHandler "proxy:unix:/run/php/php-fpm-argus.sock|fcgi://localhost"
    #</FilesMatch>

    # Dotfiles (.env, .htaccess, .git…) are never served. .env sits outside
    # DocumentRoot anyway; this is belt-and-braces.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # storage and vendor live outside DocumentRoot already, but belt-and-braces:
    <DirectoryMatch "/(\.git|storage|vendor|config)/">
        Require all denied
    </DirectoryMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/argus-error.log
    CustomLog ${APACHE_LOG_DIR}/argus-access.log combined
</VirtualHost>
</IfFile>

# Plain HTTP: serves only Let's Encrypt HTTP-01 challenges (issuance and every
# renewal) from a webroot outside the app, and redirects everything else to
# HTTPS. The office-IP restriction applies to the app on :443 only, so the ACME servers
# can reach the challenge files without opening the app itself.
<VirtualHost SERVER_PRIVATE_IP:80>
    ServerName argus.example.org

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://argus.example.org/$1

    ErrorLog  ${APACHE_LOG_DIR}/argus-error.log
    CustomLog ${APACHE_LOG_DIR}/argus-access.log combined
</VirtualHost>
